# nginx for antip.in, the same everywhere: one site in a container. /site/current/public is the site.
# In production /site/current is a symlink to the live release, behind the shared edge (Traefik, ../../edge), which
# owns ports 80/443, TLS, compression, HSTS, http -> https and www -> apex. Locally compose.local.yml mounts public/
# there, behind the local edge, and publishes 127.0.0.1:8095 for the tests.

log_format antipin '$remote_addr - $remote_user [$time_local] "$host" "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" $request_time';

# Whoever connected to the edge: trust X-Forwarded-For only from Traefik's fixed IP (EDGE_TRAEFIK_IP in the edge's .env).
set_real_ip_from 172.30.0.2;
real_ip_header X-Forwarded-For;

charset utf-8;
charset_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;
# Location: /path, not http://host/path. Redirects keep whatever host and scheme the client used.
absolute_redirect off;
server_tokens off;
# Compression happens once, at the edge.
gzip off;

server {
    listen 80 default_server;
    server_name antip.in;

    access_log /dev/stdout antipin;

    root /site/current/public;
    index index.html;
    error_page 404 /404.html;

    # Pages keep their names between releases, so browsers must ask every time (a cheap 304 when unchanged).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The stylesheet's name has its content's hash in it, so a new version is a new name.
    location /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
